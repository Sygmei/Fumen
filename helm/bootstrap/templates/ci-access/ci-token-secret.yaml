{{- if and .Values.ci_access.enabled .Values.ci_access.create_token_secret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.ci_access.token_secret_name }}
  namespace: {{ default .Release.Namespace .Values.ci_access.service_account_namespace }}
  annotations:
    kubernetes.io/service-account.name: {{ .Values.ci_access.service_account_name }}
type: kubernetes.io/service-account-token
{{- end }}
